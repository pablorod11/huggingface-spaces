[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ml-foundation"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<2", "scikit-learn>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["train", "serve", "model", "benchmark", "bootstrap_reference", "evaluation", "export_public"]
